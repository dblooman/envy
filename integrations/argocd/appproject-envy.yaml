apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: envy-control-plane
  namespace: argocd
spec:
  description: Envy control-plane Helm release; composition resources remain Envy-owned.
  sourceRepos:
    - https://github.com/dblooman/envy.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: envy-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: NetworkPolicy

