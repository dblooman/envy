          application/json:
            schema:
              $ref: '#/components/schemas/FrontendCheckRequest'
  /v1/compositions/{id}/frontend-bindings:
    parameters:
    - $ref: '#/components/parameters/CompositionID'
    - $ref: '#/components/parameters/After'
    - $ref: '#/components/parameters/Limit'
    get:
      operationId: listFrontendBindings
