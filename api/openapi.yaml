          $ref: '#/components/responses/Error'
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listBaselines
      tags: [Catalog]
      summary: List a project's registered baselines
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Bounded baseline list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Baseline'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions:
    post:
      operationId: createComposition
      tags: [Compositions]
      summary: Accept a composition and persist its create operation
      description: >-
        Provider work is asynchronous. A URL may be allocated immediately, but
        it is not ready until the expected request chain and baseline are verified.
        Same-key same-request retries return the original composition.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional retry key; different content with the same key returns 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[ -~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComposition'
            example:
              project: demo
              baseline: staging
              name: service-b-v2
              overrides:
                service-b:
                  image: envy/service-b:v2
              ttl: 8h
      responses:
        '202':
          description: Accepted, or replay of the original accepted request
          headers:
            Location:
              description: Relative composition polling location
              schema:
                type: string
                example: /v1/compositions/01999999-0000-7000-8000-000000000001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listCompositions
      tags: [Compositions]
      summary: List durable compositions, including retained tombstones
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: project
          in: query
          description: Optional project scope filter
          schema:
            type: string
      responses:
        '200':
          description: Bounded composition list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Composition'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: getComposition
      tags: [Compositions]
      summary: Get desired and observed composition state
      responses:
        '200':
          $ref: '#/components/responses/Composition'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateComposition
      tags: [Compositions]
      summary: Update the complete desired override selection with optimistic generation checking
      description: >-
        Ready or failed unexpired compositions accept an image update. The ID,
        URL and expiry remain stable. Readiness is false until the new generation
        is verified. Rolling deployment may serve the previous or new override.
        Same-image updates increment the generation without forcing a restart.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable retry key, scoped to this composition update. Replays with identical content return the original accepted operation.
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComposition'
      responses:
        '202':
          description: Update intent and operation committed
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '409':
          description: Stale generation, expired composition, deletion, or another rollout in progress
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyComposition
      tags: [Compositions]
      summary: Persist repeatable deletion intent
      description: >-
        Returns the full composition. The hostname is removed and verified before
        mesh entries and owned resources are deleted. Destroyed is recorded only
        after absence is observed. Repeating deletion is safe.
      responses:
        '202':
          description: Deletion accepted, already in progress, or already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/status:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: getCompositionStatus
      tags: [Compositions]
      summary: Get lifecycle observations and the latest durable operation
      responses:
        '200':
          description: Current composition status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionStatus'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: getCompositionEndpoints
      tags: [Compositions]
      summary: Get allocated endpoints and observed readiness
      responses:
        '200':
          description: Composition endpoint status
          content:
            application/json:
              schema:
                type: object
                required: [id, endpoints]
                properties:
                  id:
                    type: string
                  endpoints:
                    $ref: '#/components/schemas/Endpoints'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/components/{component}/logs:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
      - name: component
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getComponentLogs
      tags: [Compositions]
      summary: Read bounded application or approved supporting container logs
      description: >-
        At most three pods and ten seconds. Inherited logs are shared-baseline
        logs, without composition filtering. Logs are not stored by Envy.
        Pod read failures return partial results; byte and pod caps report truncation.
      parameters:
        - name: container
          in: query
          description: Optional captured composite container name. Defaults to application. Mesh containers and unapproved containers are rejected.
          schema: {type: string, minLength: 1, maxLength: 63}
        - name: tail_lines
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
        - name: max_bytes
          in: query
          schema: {type: integer, minimum: 1, maximum: 262144, default: 65536}
        - name: since_seconds
          in: query
          schema: {type: integer, minimum: 1, maximum: 86400}
        - name: previous
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Bounded log snapshot, possibly empty or partial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentLogs'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/events:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: listCompositionEvents
      tags: [Compositions]
      summary: List durable lifecycle events, oldest first
      description: >-
        History remains available after destruction. Existing compositions receive
        a snapshot at migration. Identical polling does not append events.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: after
          in: query
          description: Decimal event ID from the preceding next_cursor; omitted or empty starts at the beginning
          schema: {type: string, pattern: '^([1-9][0-9]*)?$'}
      responses:
        '200':
          description: Bounded lifecycle event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-envy_session
      description: HTTPS browser session. Mutations additionally require Origin and X-CSRF-Token.
    localBrowserSession:
      type: apiKey
      in: cookie
      name: envy_session
      description: Loopback HTTP browser session for authenticated local testing.
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Project:
      name: project
      in: path
      required: true
      schema:
        type: string
        example: demo
    CompositionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum returned items
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      description: Last ID from the preceding page's next_cursor
      schema:
        type: string
  responses:
    Composition:
      description: Full composition state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Composition'
    Error:
      description: Structured error; retryable indicates a potentially transient failure
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    GitHubStatus:
      type: object
      properties:
        configured:
          type: boolean
        webhook_configured:
          type: boolean
        last_webhook_at:
          type:
            - string
            - 'null'
        last_reconciled_at:
          type:
            - string
            - 'null'
        error:
          type: string
    GitHubInstallation:
      type: object
      properties:
        id:
          type: integer
        account:
          type: object
          properties:
            login:
              type: string
        permissions:
          type: object
          additionalProperties:
            type: string
    GitHubRepository:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
    PRPreviewPolicy:
      type: object
      additionalProperties: false
      required:
        - project
        - repository
        - enabled
        - baseline
        - components
        - ttl
        - workflow_id
      properties:
        project:
          type: string
        repository:
          type: string
        github_repository_id:
          type: integer
        enabled:
          type: boolean
        baseline:
          type: string
        components:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 3
          uniqueItems: true
        ttl:
          type: string
        workflow_id:
          type: integer
          minimum: 1
    PRPreview:
      type: object
      required:
        - id
        - policy
        - number
        - lifecycle
        - status
        - requested_sha
        - deployed_sha
        - terminal
      properties:
        id:
          type: string
        version:
          type: integer
        policy:
          $ref: '#/components/schemas/PRPreviewPolicy'
        number:
          type: integer
        pr_url:
          type: string
        lifecycle:
          type: integer
        requested:
          type: boolean
        terminal:
          type: boolean
        restart_barrier_at:
          type: string
          format: date-time
        last_stop_event_at:
          type: string
          format: date-time
        requested_sha:
          type: string
        deployed_sha:
          type: string
        selected_sha:
          type: string
        builds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentOverride'
        run_number:
          type: integer
        attempt:
          type: integer
        composition_id:
          type: string
        generation:
          type: integer
        url:
          type: string
        expires_at:
          type: string
        status:
          type: string
        reason:
          type: string
        updated_at:
          type: string
        comment_id:
          type: integer
        deployment_id:
          type: integer
        deployment_sha:
          type: string
        feedback_hash:
          type: string
        feedback_error:
          type: string
        deployment_status:
          type: string
          description: Composition health, independent of whether it matches the requested PR head.
        retiring_deployment_ids:
          type: array
          items: {type: integer}
    SourceRepository:
      type: object
      additionalProperties: false
      required: [project, id, github_repository, installation_id, enabled, images]
      properties:
        project: {type: string}
        id: {type: string}
        github_repository: {type: string, description: GitHub owner/repo}
        installation_id: {type: integer, minimum: 1}
        enabled: {type: boolean}
        images:
          type: object
          minProperties: 1
          maxProperties: 100
          additionalProperties: {type: string}
          description: Component IDs mapped to immutable approved registry/image locations without tags
    BuildReport:
      type: object
      additionalProperties: false
      required: [component, revision, image, run_id, attempt, built_at]
      properties: &buildReportProperties
        component: {type: string}
        revision: {type: string, pattern: '^[a-f0-9]{40}$'}
        image: {type: string, pattern: '^.+@sha256:[a-f0-9]{64}$'}
        run_id: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        attempt: {type: integer, minimum: 1, maximum: 100000}
        built_at: {type: string, format: date-time}
    PublishedBuild:
      type: object
      additionalProperties: false
      required: [id, project, repository, github_repository, component, revision, image, run_id, run_url, attempt, built_at]
      properties:
        <<: *buildReportProperties
        id: {type: string, pattern: '^[a-f0-9]{64}$'}
        project: {type: string}
        repository: {type: string}
        github_repository: {type: string}
        run_url: {type: string, format: uri}
    GitCommit:
      type: object
      required: [sha, message]
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        message: {type: string}
    GitBranch:
      type: object
      required: [sha, name]
      properties:
        sha: {type: string}
        name: {type: string}
    RevisionResolution:
      type: object
      required: [repository, commit, builds, ci_url]
      properties:
        repository: {$ref: '#/components/schemas/SourceRepository'}
        commit: {$ref: '#/components/schemas/GitCommit'}
        builds:
          type: array
          items: {$ref: '#/components/schemas/PublishedBuild'}
        next_cursor: {type: string}
        ci_url: {type: string, format: uri}
    BindFrontendRequest:
      type: object
      additionalProperties: false
      required:
      - composition
      - repository
      properties:
        composition:
          type: string
        repository:
          type: string
          format: uri
          description: HTTPS source repository; no credentials, query or fragment
    PublishFrontendRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - url
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          format: uri
          description: HTTPS; HTTP only for loopback. No credentials, query or fragment.
    FrontendCheckRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - composition_generation
      - status
      - message
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - passed
          - failed
        message:
          type: string
          minLength: 1
          maxLength: 2000
    FrontendCheck:
      type: object
      additionalProperties: false
      required:
      - composition_generation
      - status
      - message
      - reported_at
      properties:
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - passed
          - failed
        message:
          type: string
        reported_at:
          type: string
          format: date-time
    FrontendBinding:
      type: object
      additionalProperties: false
      required:
      - project
      - frontend
      - revision
      - composition
      - repository
      - version
      - created_at
      - updated_at
      properties:
        project:
          type: string
        frontend:
          type: string
        revision:
          type: string
        composition:
          type: string
        repository:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
        check:
          $ref: '#/components/schemas/FrontendCheck'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FrontendBindingView:
      type: object
      additionalProperties: false
      required:
      - binding
      - composition_phase
      - composition_generation
      - expires_at
      - ready
      - verification_level
      - check_state
      properties:
        binding:
          $ref: '#/components/schemas/FrontendBinding'
        composition_phase:
          type: string
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        expires_at:
          type: string
          format: date-time
        ready:
          type: boolean
        verification_level:
          type: string
        check_state:
          type: string
          enum:
          - not_reported
          - current
          - stale
    FrontendResolution:
      type: object
      additionalProperties: false
      required:
      - project
      - frontend
      - revision
      - composition
      - composition_generation
      - binding_version
      - api_url
      - expires_at
      - verification_level
      properties:
        project:
          type: string
        frontend:
          type: string
        revision:
          type: string
        composition:
          type: string
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        binding_version:
          type: integer
          format: int64
          minimum: 1
        api_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        verification_level:
          type: string
    FrontendBindingsPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FrontendBindingView'
        next_cursor:
          type: string
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Stable machine-readable code
        message:
          type: string
        retryable:
          type: boolean
        project:
          type: string
          description: Relevant logical project, when available
        composition:
          type: string
          description: Relevant logical composition ID, when available
    Page:
      type: object
      properties:
        next_cursor:
          type: string
          description: Last returned ID when another page exists; absent or empty on the final page
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: demo
        name:
          type: string
    ComponentRegistration:
      type: object
      additionalProperties: false
      required: [id, profile]
      allOf:
        - if:
            properties:
              profile: {const: http-small}
          then:
            required: [protocol, port, health_path, readiness_path]
            properties:
              protocol: {const: http}
              port: {minimum: 1024}
          else:
            properties:
              health_path: {maxLength: 0}
              readiness_path: {maxLength: 0}
              env: {maxProperties: 0}
              image_pull_secrets: {maxItems: 0}
      properties:
        image_pull_secrets:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            maxLength: 63
            pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: Operator-approved Secret names supplied externally in each composition namespace. No credential copying.
        execution:
          $ref: '#/components/schemas/WorkloadExecution'
        profile:
          type: string
          enum: [http-small, deployment, deployment-composite, worker, job, scheduled-job]
          description: HTTP or endpoint-free workload profile. Background profiles remain catalog-only until their provider lifecycle is enabled.
        readiness_path:
          type: string
        env:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
          description: Approved literal environment, at most 8 KiB; catalog-visible, no credentials or reserved ENVY_/POD_UID keys
        id:
          type: string
          example: service-b
        project:
          type: string
          example: demo
        protocol:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        health_path:
          type: string
        overridable:
          type: boolean
        repository:
          type: string
          description: Optional source provenance, not a composition-wide branch identity
    WorkloadExecution:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [http, worker, job, scheduled-job]
        dependencies:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            maxLength: 63
            pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
        timeout:
          type: string
          description: Required for finite jobs; constrained to 1s through 24h by the API.
        retry_limit:
          type: integer
          minimum: 0
          maximum: 10
        schedule:
          type: string
          maxLength: 128
          description: Required five-field cron expression for scheduled jobs.
        max_runs:
          type: integer
          minimum: 1
          maximum: 1000
        concurrency_policy:
          type: string
          enum: [forbid]
    Component:
      allOf:
        - $ref: '#/components/schemas/ComponentRegistration'
        - type: object
          required: [project]
    BaselineRegistration:
      type: object
      additionalProperties: false
      required: [id, revision, endpoint, components, routing, verification]
      properties:
        pubsub:
          type: object
          maxProperties: 20
          additionalProperties:
            $ref: '#/components/schemas/PubSubTopic'
        routing:
          type: object
          additionalProperties: false
          required: [namespace]
          properties:
            namespace: {type: string}
            gateway: {type: string}
            entry_component: {type: string}
            gateway_namespace: {type: string}
            gateway_section_name: {type: string}
            preview_selector:
              type: object
              additionalProperties: false
              required: [header]
              properties:
                header: {type: string}
        verification:
          type: object
          additionalProperties: false
          required: [kind]
          oneOf:
            - properties:
                kind: {const: none}
              not:
                anyOf:
                  - required: [chain]
                  - required: [path]
                  - required: [expected_status]
            - properties:
                kind: {const: envy-chain}
              required: [chain]
              not:
                anyOf:
                  - required: [path]
                  - required: [expected_status]
            - properties:
                kind: {const: http}
              not:
                required: [chain]
          properties:
            kind: {type: string, enum: [none, envy-chain, http]}
            path: {type: string, default: /, description: Absolute HTTP probe path; only for http verification}
            expected_status: {type: integer, minimum: 200, maximum: 299, default: 200}
            chain:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items: {type: string}
        id:
          type: string
          example: staging
        project:
          type: string
          example: demo
        revision:
          type: string
          description: Registered binding revision; inherited deployments remain live
        endpoint:
          type: string
          format: uri
          example: http://baseline.envy.localhost:8080
        components:
          type: object
          additionalProperties:
            type: object
            required: [service_host, port, image]
            properties:
              service_host:
                type: string
              port:
                type: integer
              image:
                type: string
    Baseline:
      allOf:
        - $ref: '#/components/schemas/BaselineRegistration'
        - type: object
          required: [project]
    ComponentOverride:
      type: object
      additionalProperties: false
      oneOf:
        - required: [image]
        - required: [build_id]
      properties:
        image:
          type: string
          minLength: 1
          maxLength: 512
          description: Direct prebuilt image; source provenance unavailable
        build_id:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Exact published build selected from revision resolution
    ResolvedComponentOverride:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
        build_id:
          type: string
        source:
          $ref: '#/components/schemas/PublishedBuild'
    CreateComposition:
      type: object
      additionalProperties: false
      required: [project, baseline, name, overrides]
      properties:
        message_isolation:
          type: boolean
          default: false
          description: Composition-wide Pub/Sub isolation, immutable for its lifetime. Consumer deployment is optional.
        expected_preview_revisions:
          type: object
          description: Optional approved profile guards for selected overrides; updates check captured revisions.
          additionalProperties: {type: integer, minimum: 1}
        expected_baseline_revision:
          type: string
          description: Optional binding revision guard. A mismatch returns 409 before accepting creation; inherited deployments remain live.
        project:
          type: string
        baseline:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
        overrides:
          type: object
          maxProperties: 3
          description: Zero to three approved overrides. An empty object creates a preview that inherits the complete baseline.
          additionalProperties:
            $ref: '#/components/schemas/ComponentOverride'
        ttl:
          type: string
          default: 8h
          description: Positive Go duration no greater than the configured maximum, default 24h
        resources:
          type: object
          maxProperties: 0
          description: Only an empty object is accepted; baseline resources are inherited
    UpdateComposition:
      type: object
      additionalProperties: false
      required: [expected_generation, overrides]
      properties:
        expected_preview_revisions:
          type: object
          description: Optional approved profile guards for selected overrides; updates check captured revisions.
          additionalProperties: {type: integer, minimum: 1}
        expected_generation:
          type: integer
          format: int64
          minimum: 1
        overrides:
          type: object
          maxProperties: 3
          description: Complete desired override set. It can add or remove components; an empty object restores complete baseline inheritance.
          additionalProperties:
            $ref: '#/components/schemas/ComponentOverride'
    Phase:
      type: string
      enum: [created, provisioning, updating, ready, completed, suspended, cancelled, failed, destroying, destroyed]
    Condition:
      type: object
      required: [type, status, message]
      properties:
        type:
          type: string
          examples: [WorkloadsReady, RoutesConfigured, RouteVerified]
        status:
          type: boolean
        message:
          type: string
    Operation:
      type: object
      required: [id, kind, status]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [create, update, destroy]
        status:
          type: string
          description: Durable operation progress or outcome
        error:
          $ref: '#/components/schemas/Error'
        initiator:
          $ref: '#/components/schemas/Principal'
    ComponentObservation:
      type: object
      required: [source, status, image]
      properties:
        source:
          type: string
          enum: [baseline, override]
        status:
          type: string
        image:
          type: string
        workload_id:
          type: string
          description: Observed workload identity where available
        execution_id:
          type: string
          description: Durable provider execution identity where available
        execution_state:
          type: string
          enum: [pending, running, ready, succeeded, failed, suspended, cancelled]
    Endpoint:
      type: object
      required: [url, ready]
      properties:
        url:
          type: string
          format: uri
        ready:
          type: boolean
          description: The registered verification contract has passed for the current generation; inspect verification_level to distinguish reachability from routing proof
    Endpoints:
      type: object
      required: [public]
      properties:
        public:
          $ref: '#/components/schemas/Endpoint'
    CompositionStatus:
      type: object
      required: [id, phase, generation, observed_generation, conditions, latest_operation]
      properties:
        verification_level:
          type: string
          enum: [none, reachability, routing]
          description: Observed evidence for the current ready generation. HTTP reachability does not prove propagation or selected workload routing.
        id:
          type: string
        phase:
          $ref: '#/components/schemas/Phase'
        generation:
          type: integer
          minimum: 1
        observed_generation:
          type: integer
          minimum: 0
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        latest_operation:
          $ref: '#/components/schemas/Operation'
        last_error:
          $ref: '#/components/schemas/Error'
    Composition:
      allOf:
        - $ref: '#/components/schemas/CompositionStatus'
        - type: object
          required:
            - project
            - baseline
            - baseline_revision
            - name
            - overrides
            - expires_at
            - created_at
            - updated_at
            - components
            - endpoints
          properties:
            message_isolation:
              type: boolean
              default: false
            message_subscriptions:
              type: array
              items:
                $ref: '#/components/schemas/MessageSubscription'
            preview_profiles:
              type: object
              additionalProperties:
                type: object
                required: [revision, source]
                properties:
                  revision: {type: integer}
                  source: {$ref: '#/components/schemas/PreviewSource'}
            project:
              type: string
            baseline:
              type: string
            baseline_revision:
              type: string
              description: Binding revision; does not freeze inherited deployments
            pr_preview_id:
              type: string
              description: Present when the GitHub preview controller owns this composition.
            name:
              type: string
            overrides:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ResolvedComponentOverride'
            expires_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            components:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ComponentObservation'
            endpoints:
              $ref: '#/components/schemas/Endpoints'

    Principal:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [human, service, shared, anonymous, system, unknown]}
        id: {type: string}
        display_name: {type: string}
        email: {type: string}
    Session:
      type: object
      required: [principal, auth_mode, channel, capabilities]
      properties:
        principal: {$ref: '#/components/schemas/Principal'}
        auth_mode: {type: string, enum: [dev, password, google, token, proxy, none]}
        channel: {type: string}
        capabilities: {type: array, items: {type: string}}
    Installation:
      type: object
      required: [id, version, auth_mode, default_ttl, max_ttl, max_compositions]
      properties:
        namespace_policy_mode: {type: string, enum: [legacy, isolated]}
        namespace_policy_ready: {type: boolean}

        id: {type: string}
        version: {type: string}
        auth_mode: {type: string}
        default_ttl: {type: string}
        max_ttl: {type: string}
        max_compositions: {type: integer}
        audit_retention: {type: string}
    Activity:
      type: object
      required: [id, occurred_at, actor, channel, action, outcome, resource_type, resource_id]
      properties:
        id: {type: string}
        occurred_at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Principal'}
        channel: {type: string}
        task: {type: string}
        action: {type: string}
        outcome: {type: string}
        project: {type: string}
        resource_type: {type: string}
        resource_id: {type: string}
        composition: {type: string}
        operation: {type: string}
        generation_from: {type: integer}
        generation_to: {type: integer}
        changes: {}
    ActivityPage:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Activity'}}
        next_cursor: {type: string}
    CompositionRevision:
      type: object
      required: [composition, project, generation, baseline, baseline_revision, overrides, created_at, actor, channel]
      properties:
        composition: {type: string}
        project: {type: string}
        generation: {type: integer, minimum: 1}
        baseline: {type: string}
        baseline_revision: {type: string}
        overrides: {type: object, additionalProperties: {$ref: '#/components/schemas/ResolvedComponentOverride'}}
        created_at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Principal'}
        channel: {type: string}
        operation: {type: string}
    RevisionsPage:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CompositionRevision'}}
        next_cursor: {type: string}
    Recipe:
      type: object
      required: [api_version, project, baseline, baseline_revision, ttl, overrides, frontends]
      properties:
        message_isolation:
          type: boolean
          default: false
          description: Composition-wide Pub/Sub isolation, immutable for its lifetime. Consumer deployment is optional.
        api_version: {type: string, const: envy/recipe-v1}
        project: {type: string}
        baseline: {type: string}
        baseline_revision: {type: string}
        ttl: {type: string}
        overrides: {type: object, additionalProperties: {$ref: '#/components/schemas/ComponentOverride'}}
        frontends: {type: array, items: {type: object, required: [name, revision, repository], properties: {name: {type: string}, revision: {type: string}, repository: {type: string, format: uri}}}}
    LogStream:
      type: object
      required: [pod, workload_id, container, text, truncated]
      properties:
        pod: {type: string}
        workload_id: {type: string}
        container: {type: string}
        text: {type: string}
        truncated: {type: boolean}
        error:
          $ref: '#/components/schemas/Error'
    ComponentLogs:
      type: object
      required: [id, project, component, source, composition_filtered, message, streams, truncated, partial]
      properties:
        id: {type: string}
        project: {type: string}
        component: {type: string}
        source: {type: string, enum: [override, shared-baseline]}
        composition_filtered: {type: boolean, const: false}
        message: {type: string}
        truncated: {type: boolean}
        partial: {type: boolean}
        streams:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/LogStream'
    LifecycleEvent:
      type: object
      required: [id, composition, project, generation, type, phase, occurred_at, operation, conditions]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        composition: {type: string}
        project: {type: string}
        generation: {type: integer, minimum: 1}
        type:
          type: string
          enum: [snapshot, create_requested, update_requested, destroy_requested, expired, observation_changed]
        phase:
          $ref: '#/components/schemas/Phase'
        occurred_at: {type: string, format: date-time}
        operation:
          $ref: '#/components/schemas/Operation'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        error:
          $ref: '#/components/schemas/Error'
    EventsPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LifecycleEvent'
        next_cursor: {type: string, pattern: '^[1-9][0-9]*$'}

    CatalogManifest:
      type: object
      additionalProperties: false
      required: [api_version, project, components, baseline]
      properties:
        api_version: {type: string, const: envy/v1}
        project: {$ref: '#/components/schemas/Project'}
        components:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ComponentRegistration'}
        baseline: {$ref: '#/components/schemas/BaselineRegistration'}
    CatalogReport:
      type: object
      additionalProperties: false
      required: [configuration, applied, checks, warnings]
      properties:
        configuration: {$ref: '#/components/schemas/CatalogManifest'}
        applied: {type: boolean}
        checks:
          type: array
          items: {$ref: '#/components/schemas/Condition'}
        warnings:
          type: array
          items: {type: string}

    PreviewSelection:
      type: object
      additionalProperties: false
      properties:
        deployment: {type: string}
        container: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        config_map_keys:
          type: object
          additionalProperties: {type: object, additionalProperties: {type: string}}
    PreviewSource:
      type: object
      required: [namespace, deployment, uid, resource_version, generation, container]
      properties:
        namespace: {type: string}
        deployment: {type: string}
        uid: {type: string}
        resource_version: {type: string}
        generation: {type: integer}
        container: {type: string}
    PreviewDependency:
      type: object
      required: [kind, name, uid, resource_version]
      properties:
        kind: {type: string, enum: [Secret, ConfigMap]}
        name: {type: string}
        uid: {type: string}
        resource_version: {type: string}
    CompositePreviewPolicy:
      type: object
      additionalProperties: false
      required: [revision, application_container, source_service_account, service_account, shared_dependencies, max_pod_cpu, max_pod_memory]
      properties:
        revision: {type: integer, minimum: 1}
        application_container: {type: string}
        sidecars: {type: array, items: {type: string}}
        init_containers: {type: array, items: {type: string}}
        native_sidecars: {type: array, items: {type: string}}
        source_service_account: {type: string}
        service_account: {type: string}
        service_account_annotations: {type: object, additionalProperties: {type: string}}
        shared_dependencies: {type: array, minItems: 1, items: {type: string}}
        max_pod_cpu: {type: string}
        max_pod_memory: {type: string}
    PreviewReport:
      type: object
      required: [source, selection, inspection, contract, dependencies, configuration, blockers, warnings, source_read_rules]
      properties:
        composite_policy_key: {type: string, description: Operator policy scope project/baseline/component}
        composite_policy: {$ref: '#/components/schemas/CompositePreviewPolicy'}
        connectivity:
          type: array
          items:
            type: object
            required: [location, hostname, message]
            properties:
              location: {type: string}
              hostname: {type: string}
              message: {type: string}
              replacement: {type: string}

        source: {$ref: '#/components/schemas/PreviewSource'}
        selection: {$ref: '#/components/schemas/PreviewSelection'}
        inspection: {type: string}
        contract: {type: string}
        dependencies: {type: array, items: {$ref: '#/components/schemas/PreviewDependency'}}
        configuration: {type: object, additionalProperties: true}
        blockers: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        source_read_rules: {type: array, items: {type: object, additionalProperties: true}}
    PreviewApproval:
      type: object
      additionalProperties: false
      required: [selection, inspection, expected_revision, confirm_connectivity]
      properties:
        selection: {$ref: '#/components/schemas/PreviewSelection'}
        inspection: {type: string}
        expected_revision: {type: integer, minimum: 0}
        confirm_connectivity: {type: boolean, const: true}
    PreviewProfile:
      type: object
      required: [project, baseline, component, revision, selection, source_uid, contract, dependencies]
      properties:
        project: {type: string}
        baseline: {type: string}
        component: {type: string}
        revision: {type: integer, minimum: 1}
        selection: {$ref: '#/components/schemas/PreviewSelection'}
        source_uid: {type: string}
        contract: {type: string}
        dependencies: {type: array, items: {$ref: '#/components/schemas/PreviewDependency'}}

    PubSubTopic:
      type: object
      additionalProperties: false
      required: [topic, publishers, consumers]
      properties:
        topic: {type: string, description: Fully qualified existing Google Pub/Sub topic}
        publishers: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        consumers:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: false
            required: [subscription, component, subscription_env]
            properties:
              subscription: {type: string, description: Existing baseline subscription with the required isolation exclusion filter}
              component: {type: string}
              subscription_env: {type: string, description: Application environment variable for the subscription; empty disables preview consumption}
              filter: {type: string, description: Business predicate combined with the Envy isolation predicate; composed maximum 256 bytes}
    MessageSubscription:
      type: object
      required: [name, topic, component, subscription_env, filter, retention, expires_at, ready]
      properties:
        name: {type: string}
        topic: {type: string}
        component: {type: string}
        subscription_env: {type: string}
        filter: {type: string}
        retention: {type: string, example: 604800s}
        expires_at: {type: string, format: date-time, description: Composition cleanup deadline; cleanup may retry beyond this time}
        ready: {type: boolean}
        backlog_may_be_lost: {type: boolean}
        instance: {type: string, readOnly: true, description: Observed subscription instance used to detect backlog loss after recreation}
