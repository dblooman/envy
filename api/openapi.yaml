          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindFrontendRequest'
    get:
      operationId: getFrontendBinding
      tags:
      - Frontend bindings
      summary: Inspect binding, including expired associations
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingView'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/frontend-bindings/{frontend}/{revision}/resolve:
    parameters: *id001
    get:
