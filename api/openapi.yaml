openapi: 3.1.0
info:
  title: Envy API
  version: 0.7.0
  description: >-
    Compose a shared staging baseline with selected prebuilt workload overrides.
    This development slice provides immutable catalog registration, up to three approved component overrides,
    durable asynchronous lifecycle, and request routing isolation.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8081
security:
  - bearerAuth: []
tags:
  - name: Catalog
  - name: Compositions
  - name: Activity
  - name: Recipes
paths:
  /v1/session:
    get:
      operationId: getSession
      responses:
        '200': {description: Effective authenticated session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/installation:
    get:
      operationId: getInstallation
      responses:
        '200': {description: Sanitized installation configuration, content: {application/json: {schema: {$ref: '#/components/schemas/Installation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/activity:
    get:
      operationId: listActivity
      tags: [Activity]
      parameters:
        - {name: after, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: project, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: outcome, in: query, schema: {type: string}}
        - {name: resource_type, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Activity page, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/compositions/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/CompositionID'}]
    get:
      operationId: listCompositionRevisions
      tags: [Activity]
      parameters:
        - {name: after, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Revision page, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionsPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/compositions/{id}/revisions/{generation}:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
      - {name: generation, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: getCompositionRevision
      tags: [Activity]
      responses:
        '200': {description: Desired-state revision, content: {application/json: {schema: {$ref: '#/components/schemas/CompositionRevision'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/recipes/export:
    post:
      operationId: exportRecipe
      tags: [Recipes]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [composition], properties: {composition: {type: string}, frontends: {type: array, maxItems: 20, items: {type: object, required: [name, revision], properties: {name: {type: string}, revision: {type: string}}}}}}}}}
      responses:
        '200': {description: Portable recipe, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/recipes/validate:
    post:
      operationId: validateRecipe
      tags: [Recipes]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
      responses:
        '200': {description: Validated recipe}
        default: {$ref: '#/components/responses/Error'}
  /v1/recipes/recreate:
    post:
      operationId: recreateRecipe
      tags: [Recipes]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [recipe, name, idempotency_key], properties: {recipe: {$ref: '#/components/schemas/Recipe'}, name: {type: string}, idempotency_key: {type: string}}}}}}
      responses:
        '202': {description: Composition and frontend binding results}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: after, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    get:
      operationId: listSourceRepositories
      tags: [Catalog]
      summary: List registered repositories including disabled entries
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SourceRepository'}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: registerSourceRepository
      tags: [Catalog]
      summary: Validate GitHub App access and register immutable component image mappings
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRepository'
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRepository'
  /v1/projects/{project}/repositories/{repository}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
    patch:
      operationId: enableSourceRepository
      tags: [Catalog]
      summary: Enable or disable a repository without changing running compositions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRepository'
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
  /v1/projects/{project}/repositories/{repository}/branches:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    get:
      operationId: listSourceBranches
      tags: [Catalog]
      summary: Browse GitHub branches with live installation access checks
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/GitBranch'}
                  page: {type: integer}
                  has_more: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories/{repository}/commits:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
      - {name: branch, in: query, required: true, schema: {type: string}}
    get:
      operationId: listSourceCommits
      tags: [Catalog]
      summary: Browse GitHub commits with live installation access checks
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/GitCommit'}
                  page: {type: integer}
                  has_more: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories/{repository}/resolve:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
      - {name: after, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: component, in: query, required: true, schema: {type: string}}
      - {name: ref, in: query, required: true, schema: {type: string}, description: Branch name or full lowercase Git SHA. Use the returned SHA for subsequent pagination.}
    get:
      operationId: resolveSourceRevision
      tags: [Catalog]
      summary: Resolve a revision and list published builds without starting CI
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionResolution'
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories/{repository}/builds:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
    post:
      operationId: reportBuild
      tags: [Catalog]
      summary: Report an immutable build using a scoped CI bearer credential (admin credentials are rejected)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedBuild'
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildReport'
  /v1/projects/{project}/frontend-bindings/{frontend}/{revision}:
    parameters: &id001
    - $ref: '#/components/parameters/Project'
    - name: frontend
      in: path
      required: true
      schema:
        type: string
    - name: revision
      in: path
      required: true
      schema:
        type: string
        pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
    put:
      operationId: bindFrontend
      tags:
      - Frontend bindings
      summary: Bind an exact frontend commit immutably to a composition
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingView'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindFrontendRequest'
    get:
      operationId: getFrontendBinding
      tags:
      - Frontend bindings
      summary: Inspect binding, including expired associations
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingView'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/frontend-bindings/{frontend}/{revision}/resolve:
    parameters: *id001
    get:
      operationId: resolveFrontend
      tags:
      - Frontend bindings
      summary: Resolve ready API URL; 409 when unready, 410 after expiry/deletion; no
        fallback
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendResolution'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/frontend-bindings/{frontend}/{revision}/deployment:
    parameters: *id001
    post:
      operationId: publishFrontend
      tags:
      - Frontend bindings
      summary: Record caller-reported URL with optimistic version checking; does not
        deploy hosting
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingView'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishFrontendRequest'
  /v1/projects/{project}/frontend-bindings/{frontend}/{revision}/check:
    parameters: *id001
    post:
      operationId: reportFrontendCheck
      tags:
      - Frontend bindings
      summary: Record caller-reported browser evidence against current backend generation
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingView'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrontendCheckRequest'
  /v1/compositions/{id}/frontend-bindings:
    parameters:
    - $ref: '#/components/parameters/CompositionID'
    - $ref: '#/components/parameters/After'
    - $ref: '#/components/parameters/Limit'
    get:
      operationId: listFrontendBindings
      tags:
      - Frontend bindings
      summary: List a composition’s exact frontend revisions
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingsPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/catalog/validate:
    post:
      operationId: validateCatalogConfiguration
      tags: [Catalog]
      summary: Validate existing application infrastructure without writes
      description: A versioned JSON bundle; identical existing registrations are retained and differing immutable entries return 409. No workloads are created or adopted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogManifest'
      responses:
        '200':
          description: Normalized configuration, connectivity checks and verification limitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReport'
        default:
          $ref: '#/components/responses/Error'
  /v1/catalog/apply:
    post:
      operationId: applyCatalogConfiguration
      tags: [Catalog]
      summary: Validate and atomically register an application configuration
      description: A versioned JSON bundle; identical existing registrations are retained and differing immutable entries return 409. No workloads are created or adopted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogManifest'
      responses:
        '200':
          description: Normalized configuration, connectivity checks and verification limitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReport'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects:
    post:
      operationId: registerProject
      tags: [Catalog]
      summary: Register an immutable project
      description: Duplicate IDs or routing host claims return 409. Baseline registration validates existing sidecar workloads, ingress normalization and routing ownership before persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      tags: [Catalog]
      summary: List registered projects
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Bounded project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/components:
    post:
      operationId: registerComponent
      tags: [Catalog]
      summary: Register an immutable component
      description: Duplicate IDs or routing host claims return 409. Baseline registration validates existing sidecar workloads, ingress normalization and routing ownership before persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentRegistration'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listComponents
      tags: [Catalog]
      summary: List a project's component profiles
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Bounded component list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Component'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/components/{component}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: component
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getComponent
      tags: [Catalog]
      summary: Get an approved component profile
      responses:
        '200':
          description: Component profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/baselines:
    post:
      operationId: registerBaseline
      tags: [Catalog]
      summary: Register an immutable baseline
      description: Duplicate IDs or routing host claims return 409. Baseline registration validates existing sidecar workloads, ingress normalization and routing ownership before persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaselineRegistration'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Baseline'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listBaselines
      tags: [Catalog]
      summary: List a project's registered baselines
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Bounded baseline list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Baseline'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions:
    post:
      operationId: createComposition
      tags: [Compositions]
      summary: Accept a composition and persist its create operation
      description: >-
        Provider work is asynchronous. A URL may be allocated immediately, but
        it is not ready until the expected request chain and baseline are verified.
        Same-key same-request retries return the original composition.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional retry key; different content with the same key returns 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[ -~]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComposition'
            example:
              project: demo
              baseline: staging
              name: service-b-v2
              overrides:
                service-b:
                  image: envy/service-b:v2
              ttl: 8h
      responses:
        '202':
          description: Accepted, or replay of the original accepted request
          headers:
            Location:
              description: Relative composition polling location
              schema:
                type: string
                example: /v1/compositions/01999999-0000-7000-8000-000000000001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listCompositions
      tags: [Compositions]
      summary: List durable compositions, including retained tombstones
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
        - name: project
          in: query
          description: Optional project scope filter
          schema:
            type: string
      responses:
        '200':
          description: Bounded composition list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Composition'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: getComposition
      tags: [Compositions]
      summary: Get desired and observed composition state
      responses:
        '200':
          $ref: '#/components/responses/Composition'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateComposition
      tags: [Compositions]
      summary: Update the complete desired override selection with optimistic generation checking
      description: >-
        Ready or failed unexpired compositions accept an image update. The ID,
        URL and expiry remain stable. Readiness is false until the new generation
        is verified. Rolling deployment may serve the previous or new override.
        Same-image updates increment the generation without forcing a restart.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Stable retry key, scoped to this composition update. Replays with identical content return the original accepted operation.
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComposition'
      responses:
        '202':
          description: Update intent and operation committed
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '409':
          description: Stale generation, expired composition, deletion, or another rollout in progress
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: destroyComposition
      tags: [Compositions]
      summary: Persist repeatable deletion intent
      description: >-
        Returns the full composition. The hostname is removed and verified before
        mesh entries and owned resources are deleted. Destroyed is recorded only
        after absence is observed. Repeating deletion is safe.
      responses:
        '202':
          description: Deletion accepted, already in progress, or already completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/status:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: getCompositionStatus
      tags: [Compositions]
      summary: Get lifecycle observations and the latest durable operation
      responses:
        '200':
          description: Current composition status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionStatus'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/endpoints:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: getCompositionEndpoints
      tags: [Compositions]
      summary: Get allocated endpoints and observed readiness
      responses:
        '200':
          description: Composition endpoint status
          content:
            application/json:
              schema:
                type: object
                required: [id, endpoints]
                properties:
                  id:
                    type: string
                  endpoints:
                    $ref: '#/components/schemas/Endpoints'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/components/{component}/logs:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
      - name: component
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getComponentLogs
      tags: [Compositions]
      summary: Read bounded application container logs
      description: >-
        At most three pods and ten seconds. Inherited logs are shared-baseline
        logs, without composition filtering. Logs are not stored by Envy.
        Pod read failures return partial results; byte and pod caps report truncation.
      parameters:
        - name: tail_lines
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
        - name: max_bytes
          in: query
          schema: {type: integer, minimum: 1, maximum: 262144, default: 65536}
        - name: since_seconds
          in: query
          schema: {type: integer, minimum: 1, maximum: 86400}
        - name: previous
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Bounded log snapshot, possibly empty or partial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentLogs'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/compositions/{id}/events:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
    get:
      operationId: listCompositionEvents
      tags: [Compositions]
      summary: List durable lifecycle events, oldest first
      description: >-
        History remains available after destruction. Existing compositions receive
        a snapshot at migration. Identical polling does not append events.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: after
          in: query
          description: Decimal event ID from the preceding next_cursor; omitted or empty starts at the beginning
          schema: {type: string, pattern: '^([1-9][0-9]*)?$'}
      responses:
        '200':
          description: Bounded lifecycle event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Project:
      name: project
      in: path
      required: true
      schema:
        type: string
        example: demo
    CompositionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maximum returned items
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      description: Last ID from the preceding page's next_cursor
      schema:
        type: string
  responses:
    Composition:
      description: Full composition state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Composition'
    Error:
      description: Structured error; retryable indicates a potentially transient failure
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                $ref: '#/components/schemas/Error'
  schemas:
    SourceRepository:
      type: object
      additionalProperties: false
      required: [project, id, github_repository, installation_id, enabled, images]
      properties:
        project: {type: string}
        id: {type: string}
        github_repository: {type: string, description: GitHub owner/repo}
        installation_id: {type: integer, minimum: 1}
        enabled: {type: boolean}
        images:
          type: object
          minProperties: 1
          maxProperties: 100
          additionalProperties: {type: string}
          description: Component IDs mapped to immutable approved registry/image locations without tags
    BuildReport:
      type: object
      additionalProperties: false
      required: [component, revision, image, run_id, attempt, built_at]
      properties: &buildReportProperties
        component: {type: string}
        revision: {type: string, pattern: '^[a-f0-9]{40}$'}
        image: {type: string, pattern: '^.+@sha256:[a-f0-9]{64}$'}
        run_id: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        attempt: {type: integer, minimum: 1, maximum: 100000}
        built_at: {type: string, format: date-time}
    PublishedBuild:
      type: object
      additionalProperties: false
      required: [id, project, repository, github_repository, component, revision, image, run_id, run_url, attempt, built_at]
      properties:
        <<: *buildReportProperties
        id: {type: string, pattern: '^[a-f0-9]{64}$'}
        project: {type: string}
        repository: {type: string}
        github_repository: {type: string}
        run_url: {type: string, format: uri}
    GitCommit:
      type: object
      required: [sha, message]
      properties:
        sha: {type: string, pattern: '^[a-f0-9]{40}$'}
        message: {type: string}
    GitBranch:
      type: object
      required: [sha, name]
      properties:
        sha: {type: string}
        name: {type: string}
    RevisionResolution:
      type: object
      required: [repository, commit, builds, ci_url]
      properties:
        repository: {$ref: '#/components/schemas/SourceRepository'}
        commit: {$ref: '#/components/schemas/GitCommit'}
        builds:
          type: array
          items: {$ref: '#/components/schemas/PublishedBuild'}
        next_cursor: {type: string}
        ci_url: {type: string, format: uri}
    BindFrontendRequest:
      type: object
      additionalProperties: false
      required:
      - composition
      - repository
      properties:
        composition:
          type: string
        repository:
          type: string
          format: uri
          description: HTTPS source repository; no credentials, query or fragment
    PublishFrontendRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - url
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          format: uri
          description: HTTPS; HTTP only for loopback. No credentials, query or fragment.
    FrontendCheckRequest:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - composition_generation
      - status
      - message
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 1
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - passed
          - failed
        message:
          type: string
          minLength: 1
          maxLength: 2000
    FrontendCheck:
      type: object
      additionalProperties: false
      required:
      - composition_generation
      - status
      - message
      - reported_at
      properties:
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - passed
          - failed
        message:
          type: string
        reported_at:
          type: string
          format: date-time
    FrontendBinding:
      type: object
      additionalProperties: false
      required:
      - project
      - frontend
      - revision
      - composition
      - repository
      - version
      - created_at
      - updated_at
      properties:
        project:
          type: string
        frontend:
          type: string
        revision:
          type: string
        composition:
          type: string
        repository:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
        check:
          $ref: '#/components/schemas/FrontendCheck'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FrontendBindingView:
      type: object
      additionalProperties: false
      required:
      - binding
      - composition_phase
      - composition_generation
      - expires_at
      - ready
      - verification_level
      - check_state
      properties:
        binding:
          $ref: '#/components/schemas/FrontendBinding'
        composition_phase:
          type: string
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        expires_at:
          type: string
          format: date-time
        ready:
          type: boolean
        verification_level:
          type: string
        check_state:
          type: string
          enum:
          - not_reported
          - current
          - stale
    FrontendResolution:
      type: object
      additionalProperties: false
      required:
      - project
      - frontend
      - revision
      - composition
      - composition_generation
      - binding_version
      - api_url
      - expires_at
      - verification_level
      properties:
        project:
          type: string
        frontend:
          type: string
        revision:
          type: string
        composition:
          type: string
        composition_generation:
          type: integer
          format: int64
          minimum: 1
        binding_version:
          type: integer
          format: int64
          minimum: 1
        api_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        verification_level:
          type: string
    FrontendBindingsPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FrontendBindingView'
        next_cursor:
          type: string
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Stable machine-readable code
        message:
          type: string
        retryable:
          type: boolean
        project:
          type: string
          description: Relevant logical project, when available
        composition:
          type: string
          description: Relevant logical composition ID, when available
    Page:
      type: object
      properties:
        next_cursor:
          type: string
          description: Last returned ID when another page exists; absent or empty on the final page
    Project:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          example: demo
        name:
          type: string
    ComponentRegistration:
      type: object
      additionalProperties: false
      required: [id, protocol, port, profile, health_path, readiness_path]
      properties:
        image_pull_secrets:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            maxLength: 63
            pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: Operator-approved Secret names supplied externally in each composition namespace. No credential copying.
        profile:
          type: string
          const: http-small
          description: Fixed non-root resources and service account; no arbitrary pod configuration
        readiness_path:
          type: string
        env:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
          description: Approved literal environment, at most 8 KiB; catalog-visible, no credentials or reserved ENVY_/POD_UID keys
        id:
          type: string
          example: service-b
        project:
          type: string
          example: demo
        protocol:
          type: string
          const: http
        port:
          type: integer
          minimum: 1024
          maximum: 65535
        health_path:
          type: string
        overridable:
          type: boolean
        repository:
          type: string
          description: Optional source provenance, not a composition-wide branch identity
    Component:
      allOf:
        - $ref: '#/components/schemas/ComponentRegistration'
        - type: object
          required: [project]
    BaselineRegistration:
      type: object
      additionalProperties: false
      required: [id, revision, endpoint, components, routing, verification]
      properties:
        routing:
          type: object
          additionalProperties: false
          required: [namespace, gateway, entry_component]
          properties:
            namespace: {type: string}
            gateway: {type: string}
            entry_component: {type: string}
            gateway_namespace: {type: string}
            gateway_section_name: {type: string}
        verification:
          type: object
          additionalProperties: false
          required: [kind]
          oneOf:
            - properties:
                kind: {const: envy-chain}
              required: [chain]
              not:
                anyOf:
                  - required: [path]
                  - required: [expected_status]
            - properties:
                kind: {const: http}
              not:
                required: [chain]
          properties:
            kind: {type: string, enum: [envy-chain, http]}
            path: {type: string, default: /, description: Absolute HTTP probe path; only for http verification}
            expected_status: {type: integer, minimum: 200, maximum: 299, default: 200}
            chain:
              type: array
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items: {type: string}
        id:
          type: string
          example: staging
        project:
          type: string
          example: demo
        revision:
          type: string
          description: Registered binding revision; inherited deployments remain live
        endpoint:
          type: string
          format: uri
          example: http://baseline.envy.localhost:8080
        components:
          type: object
          additionalProperties:
            type: object
            required: [service_host, port, image]
            properties:
              service_host:
                type: string
              port:
                type: integer
              image:
                type: string
    Baseline:
      allOf:
        - $ref: '#/components/schemas/BaselineRegistration'
        - type: object
          required: [project]
    ComponentOverride:
      type: object
      additionalProperties: false
      oneOf:
        - required: [image]
        - required: [build_id]
      properties:
        image:
          type: string
          minLength: 1
          maxLength: 512
          description: Direct prebuilt image; source provenance unavailable
        build_id:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Exact published build selected from revision resolution
    ResolvedComponentOverride:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
        build_id:
          type: string
        source:
          $ref: '#/components/schemas/PublishedBuild'
    CreateComposition:
      type: object
      additionalProperties: false
      required: [project, baseline, name, overrides]
      properties:
        expected_baseline_revision:
          type: string
          description: Optional binding revision guard. A mismatch returns 409 before accepting creation; inherited deployments remain live.
        project:
          type: string
        baseline:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
        overrides:
          type: object
          maxProperties: 3
          description: Zero to three approved overrides. An empty object creates a preview that inherits the complete baseline.
          additionalProperties:
            $ref: '#/components/schemas/ComponentOverride'
        ttl:
          type: string
          default: 8h
          description: Positive Go duration no greater than the configured maximum, default 24h
        resources:
          type: object
          maxProperties: 0
          description: Only an empty object is accepted; baseline resources are inherited
    UpdateComposition:
      type: object
      additionalProperties: false
      required: [expected_generation, overrides]
      properties:
        expected_generation:
          type: integer
          format: int64
          minimum: 1
        overrides:
          type: object
          maxProperties: 3
          description: Complete desired override set. It can add or remove components; an empty object restores complete baseline inheritance.
          additionalProperties:
            $ref: '#/components/schemas/ComponentOverride'
    Phase:
      type: string
      enum: [created, provisioning, updating, ready, failed, destroying, destroyed]
    Condition:
      type: object
      required: [type, status, message]
      properties:
        type:
          type: string
          examples: [WorkloadsReady, RoutesConfigured, RouteVerified]
        status:
          type: boolean
        message:
          type: string
    Operation:
      type: object
      required: [id, kind, status]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [create, update, destroy]
        status:
          type: string
          description: Durable operation progress or outcome
        error:
          $ref: '#/components/schemas/Error'
        initiator:
          $ref: '#/components/schemas/Principal'
    ComponentObservation:
      type: object
      required: [source, status, image]
      properties:
        source:
          type: string
          enum: [baseline, override]
        status:
          type: string
        image:
          type: string
        workload_id:
          type: string
          description: Observed workload identity where available
    Endpoint:
      type: object
      required: [url, ready]
      properties:
        url:
          type: string
          format: uri
        ready:
          type: boolean
          description: The registered verification contract has passed for the current generation; inspect verification_level to distinguish reachability from routing proof
    Endpoints:
      type: object
      required: [public]
      properties:
        public:
          $ref: '#/components/schemas/Endpoint'
    CompositionStatus:
      type: object
      required: [id, phase, generation, observed_generation, conditions, latest_operation]
      properties:
        verification_level:
          type: string
          enum: [none, reachability, routing]
          description: Observed evidence for the current ready generation. HTTP reachability does not prove propagation or selected workload routing.
        id:
          type: string
        phase:
          $ref: '#/components/schemas/Phase'
        generation:
          type: integer
          minimum: 1
        observed_generation:
          type: integer
          minimum: 0
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        latest_operation:
          $ref: '#/components/schemas/Operation'
        last_error:
          $ref: '#/components/schemas/Error'
    Composition:
      allOf:
        - $ref: '#/components/schemas/CompositionStatus'
        - type: object
          required:
            - project
            - baseline
            - baseline_revision
            - name
            - overrides
            - expires_at
            - created_at
            - updated_at
            - components
            - endpoints
          properties:
            project:
              type: string
            baseline:
              type: string
            baseline_revision:
              type: string
              description: Binding revision; does not freeze inherited deployments
            name:
              type: string
            overrides:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ResolvedComponentOverride'
            expires_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            components:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ComponentObservation'
            endpoints:
              $ref: '#/components/schemas/Endpoints'

    Principal:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [human, service, shared, anonymous, system, unknown]}
        id: {type: string}
        display_name: {type: string}
        email: {type: string}
    Session:
      type: object
      required: [principal, auth_mode, channel, capabilities]
      properties:
        principal: {$ref: '#/components/schemas/Principal'}
        auth_mode: {type: string, enum: [token, proxy, none]}
        channel: {type: string}
        capabilities: {type: array, items: {type: string}}
    Installation:
      type: object
      required: [id, version, auth_mode, default_ttl, max_ttl, max_compositions]
      properties:
        id: {type: string}
        version: {type: string}
        auth_mode: {type: string}
        default_ttl: {type: string}
        max_ttl: {type: string}
        max_compositions: {type: integer}
        audit_retention: {type: string}
    Activity:
      type: object
      required: [id, occurred_at, actor, channel, action, outcome, resource_type, resource_id]
      properties:
        id: {type: string}
        occurred_at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Principal'}
        channel: {type: string}
        task: {type: string}
        action: {type: string}
        outcome: {type: string}
        project: {type: string}
        resource_type: {type: string}
        resource_id: {type: string}
        composition: {type: string}
        operation: {type: string}
        generation_from: {type: integer}
        generation_to: {type: integer}
        changes: {}
    ActivityPage:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Activity'}}
        next_cursor: {type: string}
    CompositionRevision:
      type: object
      required: [composition, project, generation, baseline, baseline_revision, overrides, created_at, actor, channel]
      properties:
        composition: {type: string}
        project: {type: string}
        generation: {type: integer, minimum: 1}
        baseline: {type: string}
        baseline_revision: {type: string}
        overrides: {type: object, additionalProperties: {$ref: '#/components/schemas/ResolvedComponentOverride'}}
        created_at: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Principal'}
        channel: {type: string}
        operation: {type: string}
    RevisionsPage:
      type: object
      required: [items]
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CompositionRevision'}}
        next_cursor: {type: string}
    Recipe:
      type: object
      required: [api_version, project, baseline, baseline_revision, ttl, overrides, frontends]
      properties:
        api_version: {type: string, const: envy/recipe-v1}
        project: {type: string}
        baseline: {type: string}
        baseline_revision: {type: string}
        ttl: {type: string}
        overrides: {type: object, additionalProperties: {$ref: '#/components/schemas/ComponentOverride'}}
        frontends: {type: array, items: {type: object, required: [name, revision, repository], properties: {name: {type: string}, revision: {type: string}, repository: {type: string, format: uri}}}}
    LogStream:
      type: object
      required: [pod, workload_id, container, text, truncated]
      properties:
        pod: {type: string}
        workload_id: {type: string}
        container: {type: string}
        text: {type: string}
        truncated: {type: boolean}
        error:
          $ref: '#/components/schemas/Error'
    ComponentLogs:
      type: object
      required: [id, project, component, source, composition_filtered, message, streams, truncated, partial]
      properties:
        id: {type: string}
        project: {type: string}
        component: {type: string}
        source: {type: string, enum: [override, shared-baseline]}
        composition_filtered: {type: boolean, const: false}
        message: {type: string}
        truncated: {type: boolean}
        partial: {type: boolean}
        streams:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/LogStream'
    LifecycleEvent:
      type: object
      required: [id, composition, project, generation, type, phase, occurred_at, operation, conditions]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        composition: {type: string}
        project: {type: string}
        generation: {type: integer, minimum: 1}
        type:
          type: string
          enum: [snapshot, create_requested, update_requested, destroy_requested, expired, observation_changed]
        phase:
          $ref: '#/components/schemas/Phase'
        occurred_at: {type: string, format: date-time}
        operation:
          $ref: '#/components/schemas/Operation'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        error:
          $ref: '#/components/schemas/Error'
    EventsPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/LifecycleEvent'
        next_cursor: {type: string, pattern: '^[1-9][0-9]*$'}

    CatalogManifest:
      type: object
      additionalProperties: false
      required: [api_version, project, components, baseline]
      properties:
        api_version: {type: string, const: envy/v1}
        project: {$ref: '#/components/schemas/Project'}
        components:
          type: array
          minItems: 1
          maxItems: 20
          items: {$ref: '#/components/schemas/ComponentRegistration'}
        baseline: {$ref: '#/components/schemas/BaselineRegistration'}
    CatalogReport:
      type: object
      additionalProperties: false
      required: [configuration, applied, checks, warnings]
      properties:
        configuration: {$ref: '#/components/schemas/CatalogManifest'}
        applied: {type: boolean}
        checks:
          type: array
          items: {$ref: '#/components/schemas/Condition'}
        warnings:
          type: array
          items: {type: string}
