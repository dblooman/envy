openapi: 3.1.0
info:
  title: Envy API
  version: 0.7.0
  description: >-
    Compose a shared staging baseline with selected prebuilt workload overrides.
    This development slice provides immutable catalog registration, up to three approved component overrides,
    durable asynchronous lifecycle, and request routing isolation.
    Authentication depends on installation mode: Envy/machine bearer credentials,
    browser session cookies (password/Google), trusted proxy identity, or explicit dev/none.
    Browser mutations require same-origin Origin and X-CSRF-Token from /auth/config.
    OAuth discovery and MCP authorization are documented in docs/authentication-and-activity.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8081
security:
  - bearerAuth: []
  - browserSession: []
  - localBrowserSession: []
tags:
  - name: Catalog
  - name: Compositions
  - name: Activity
  - name: Recipes
  - name: GitHub
paths:
  /webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      tags:
        - GitHub
      security: []
      description: >-
        Requires HMAC-SHA256 over the raw body using the operator webhook secret. Acknowledged only after
        durable storage; delivery IDs deduplicate retries.
      parameters:
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '202':
          description: Delivery durably accepted
        default:
          $ref: '#/components/responses/Error'
  /v1/github/status:
    get:
      operationId: getGitHubStatus
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubStatus'
        default:
          $ref: '#/components/responses/Error'
  /v1/github/installations:
    get:
      operationId: listGitHubInstallations
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GitHubInstallation'
                  page:
                    type: integer
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
  /v1/github/installations/{installation}/repositories:
    parameters:
      - name: installation
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: listGitHubInstallationRepositories
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/GitHubRepository'
                  page:
                    type: integer
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
  /v1/github/preview-policies:
    get:
      operationId: listPRPreviewPolicies
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PRPreviewPolicy'
                  page:
                    type: integer
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/repositories/{repository}/preview-policy:
    get:
      operationId: getPRPreviewPolicy
      tags: [GitHub]
      responses:
        '200':
          description: Repository preview policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PRPreviewPolicy'}
        default: {$ref: '#/components/responses/Error'}
    parameters:
      - name: project
        in: path
        required: true
        schema:
          type: string
      - name: repository
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: savePRPreviewPolicy
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRPreviewPolicy'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PRPreviewPolicy'
  /v1/github/previews:
    get:
      operationId: listPRPreviews
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PRPreview'
                  page:
                    type: integer
                  has_more:
                    type: boolean
                  next_cursor:
                    type: string
        default:
          $ref: '#/components/responses/Error'
      parameters:
        - name: project
          in: query
          required: false
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
  /v1/github/previews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPRPreview
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRPreview'
        default:
          $ref: '#/components/responses/Error'
  /v1/github/previews/{id}/stop:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: stopPRPreview
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRPreview'
        default:
          $ref: '#/components/responses/Error'
  /v1/github/previews/{id}/restart:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: restartPRPreview
      tags:
        - GitHub
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PRPreview'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/baselines/{baseline}/components/{component}/preview-profile/discover:
    parameters:
      - {name: project, in: path, required: true, schema: {type: string}}
      - {name: baseline, in: path, required: true, schema: {type: string}}
      - {name: component, in: path, required: true, schema: {type: string}}
    post:
      operationId: discoverPreviewProfile
      tags: [Catalog]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewSelection'}}}}
      responses:
        '200': {description: Preview profile operation result, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewReport'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/baselines/{baseline}/components/{component}/preview-profile/approve:
    parameters:
      - {name: project, in: path, required: true, schema: {type: string}}
      - {name: baseline, in: path, required: true, schema: {type: string}}
      - {name: component, in: path, required: true, schema: {type: string}}
    post:
      operationId: approvePreviewProfile
      tags: [Catalog]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewApproval'}}}}
      responses:
        '200': {description: Preview profile operation result, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewProfile'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/baselines/{baseline}/components/{component}/preview-profile:
    parameters:
      - {name: project, in: path, required: true, schema: {type: string}}
      - {name: baseline, in: path, required: true, schema: {type: string}}
      - {name: component, in: path, required: true, schema: {type: string}}
    get:
      operationId: inspectPreviewProfile
      tags: [Catalog]
      responses:
        '200': {description: Preview profile operation result, content: {application/json: {schema: {$ref: '#/components/schemas/PreviewProfile'}}}}
        default: {$ref: '#/components/responses/Error'}
  /auth/config:
    get:
      operationId: getAuthenticationConfig
      security: []
      responses:
        '200':
          description: Public login mode and browser CSRF token; sets an HttpOnly CSRF cookie.
          content:
            application/json:
              schema:
                type: object
                required: [mode, csrf_token]
                properties:
                  mode: {type: string, enum: [dev, password, google, token, proxy, none]}
                  csrf_token: {type: string}
  /auth/password:
    post:
      operationId: loginWithPassword
      security: []
      description: Available only in password mode. Requires same-origin Origin and X-CSRF-Token with its CSRF cookie. Sets the browser session cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, const: admin}
                password: {type: string, format: password, writeOnly: true}
      responses:
        '200': {description: Browser logged in}
        '401': {description: Invalid username or password}
        '403': {description: Invalid Origin or CSRF token}
        '429': {description: Login rate limit reached}
  /auth/logout:
    post:
      operationId: logoutBrowser
      description: Revoke this browser session. Requires same-origin Origin and X-CSRF-Token.
      security: []
      responses:
        '200': {description: Browser cookie cleared and session revoked}
        '403': {description: Invalid Origin or CSRF token}
  /auth/logout-all:
    post:
      operationId: logoutEverywhere
      description: Revoke all browser sessions and agent grants for this identity. Requires a browser session, same-origin Origin and X-CSRF-Token.
      security: [{browserSession: []}, {localBrowserSession: []}]
      responses:
        '200': {description: All identity sessions and grants revoked}
        '401': {description: Browser session required}
        '403': {description: Invalid Origin or CSRF token}
  /auth/google/start:
    get:
      operationId: startGoogleLogin
      security: []
      parameters:
        - {name: return_to, in: query, schema: {type: string}, description: Same-origin relative destination after login}
      responses:
        '303': {description: Redirect to Google identity verification}
  /auth/google/callback:
    get:
      operationId: finishGoogleLogin
      security: []
      description: Validates the single-use Google state, browser binding, nonce and ID token. Sets an Envy session for admitted accounts.
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '303': {description: Redirect to the original destination or login failure screen}
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationMetadata
      security: []
      responses:
        '200': {description: OAuth issuer, endpoints, supported grants and S256 PKCE methods}
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getMCPResourceMetadata
      security: []
      responses:
        '200': {description: MCP resource URI, authorization server and scopes}
  /.well-known/oauth-protected-resource/v1:
    get:
      operationId: getAPIResourceMetadata
      security: []
      responses:
        '200': {description: REST resource URI, authorization server and scopes}
  /oauth/register:
    post:
      operationId: registerOAuthClient
      security: []
      description: Register a public client. Redirects must be HTTPS or HTTP loopback; only authorization_code and refresh_token grants are supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                client_name: {type: string, maxLength: 200}
                redirect_uris: {type: array, minItems: 1, maxItems: 10, items: {type: string, format: uri}}
                token_endpoint_auth_method: {type: string, const: none}
                grant_types: {type: array, items: {type: string, enum: [authorization_code, refresh_token]}}
                response_types: {type: array, items: {type: string, const: code}}
      responses:
        '201': {description: Registered client ID and public client metadata}
        '400': {description: Invalid client metadata}
        '429': {description: Registration rate or capacity limit reached}
  /oauth/authorize:
    get:
      operationId: authorizeOAuthClient
      security: []
      description: Standard authorization-code request with required resource, scope envy, state, registered redirect_uri and S256 code_challenge. Redirects unauthenticated browsers to login; authenticated browsers receive an explicit approval form.
      responses:
        '200': {description: Browser consent form}
        '302': {description: OAuth redirect response}
        '303': {description: Login redirect}
        '400': {description: Invalid authorization request}
    post:
      operationId: approveOAuthClient
      security: [{browserSession: []}, {localBrowserSession: []}]
      description: Submit the browser-bound pending consent form with decision allow or deny, csrf_token and same-origin Origin.
      responses:
        '302': {description: Single-use authorization code or access-denied redirect}
        '303': {description: Redirect response}
        '400': {description: Invalid or expired browser-bound request}
        '403': {description: Invalid Origin or CSRF token}
  /oauth/token:
    post:
      operationId: exchangeOAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, resource]
              properties:
                grant_type: {type: string, enum: [authorization_code, refresh_token]}
                client_id: {type: string}
                resource: {type: string, format: uri, description: Must match the original authorized resource}
                code: {type: string, description: Required for authorization_code}
                redirect_uri: {type: string, description: Required for authorization_code}
                code_verifier: {type: string, description: Required S256 verifier for authorization_code}
                refresh_token: {type: string, description: Required for refresh_token}
      responses:
        '200':
          description: Envy access token and rotating refresh token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, refresh_token]
                properties:
                  access_token: {type: string}
                  token_type: {type: string}
                  expires_in: {type: integer}
                  refresh_token: {type: string}
                  scope: {type: string}
        '400': {description: OAuth error; invalid, expired or reused grant, PKCE failure, or mismatched resource}
  /oauth/revoke:
    post:
      operationId: revokeOAuthGrant
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, token]
              properties:
                client_id: {type: string}
                token: {type: string}
                token_type_hint: {type: string, enum: [access_token, refresh_token]}
      responses:
        '200': {description: Associated grant revoked, or token was already invalid}
  /mcp:
    post:
      operationId: streamableMCP
      security: [{bearerAuth: []}]
      description: Streamable HTTP MCP JSON-RPC. OAuth credentials must be bound to this resource; build credentials and browser cookies are not accepted. Dev/none modes retain their explicit identity behavior.
      responses:
        '200': {description: MCP response}
        '202': {description: MCP notification accepted}
        '401': {description: OAuth discovery challenge in WWW-Authenticate}
  /v1/session:
    get:
      operationId: getSession
      responses:
        '200': {description: Effective authenticated session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/installation:
    get:
      operationId: getInstallation
      responses:
        '200': {description: Sanitized installation configuration, content: {application/json: {schema: {$ref: '#/components/schemas/Installation'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/activity:
    get:
      operationId: listActivity
      tags: [Activity]
      parameters:
        - {name: after, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: project, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: outcome, in: query, schema: {type: string}}
        - {name: resource_type, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Activity page, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/compositions/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/CompositionID'}]
    get:
      operationId: listCompositionRevisions
      tags: [Activity]
      parameters:
        - {name: after, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Revision page, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionsPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/compositions/{id}/revisions/{generation}:
    parameters:
      - $ref: '#/components/parameters/CompositionID'
      - {name: generation, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: getCompositionRevision
      tags: [Activity]
      responses:
        '200': {description: Desired-state revision, content: {application/json: {schema: {$ref: '#/components/schemas/CompositionRevision'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/recipes/export:
    post:
      operationId: exportRecipe
      tags: [Recipes]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [composition], properties: {composition: {type: string}, frontends: {type: array, maxItems: 20, items: {type: object, required: [name, revision], properties: {name: {type: string}, revision: {type: string}}}}}}}}}
      responses:
        '200': {description: Portable recipe, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
        default: {$ref: '#/components/responses/Error'}
  /v1/recipes/validate:
    post:
      operationId: validateRecipe
      tags: [Recipes]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
      responses:
        '200': {description: Validated recipe}
        default: {$ref: '#/components/responses/Error'}
  /v1/recipes/recreate:
    post:
      operationId: recreateRecipe
      tags: [Recipes]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [recipe, name, idempotency_key], properties: {recipe: {$ref: '#/components/schemas/Recipe'}, name: {type: string}, idempotency_key: {type: string}}}}}}
      responses:
        '202': {description: Composition and frontend binding results}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: after, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    get:
      operationId: listSourceRepositories
      tags: [Catalog]
      summary: List registered repositories including disabled entries
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SourceRepository'}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: registerSourceRepository
      tags: [Catalog]
      summary: Validate GitHub App access and register immutable component image mappings
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRepository'
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRepository'
  /v1/projects/{project}/repositories/{repository}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
    patch:
      operationId: enableSourceRepository
      tags: [Catalog]
      summary: Enable or disable a repository without changing running compositions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRepository'
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
  /v1/projects/{project}/repositories/{repository}/branches:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    get:
      operationId: listSourceBranches
      tags: [Catalog]
      summary: Browse GitHub branches with live installation access checks
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/GitBranch'}
                  page: {type: integer}
                  has_more: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories/{repository}/commits:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
      - {name: branch, in: query, required: true, schema: {type: string}}
    get:
      operationId: listSourceCommits
      tags: [Catalog]
      summary: Browse GitHub commits with live installation access checks
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/GitCommit'}
                  page: {type: integer}
                  has_more: {type: boolean}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories/{repository}/resolve:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
      - {name: after, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: component, in: query, required: true, schema: {type: string}}
      - {name: ref, in: query, required: true, schema: {type: string}, description: Branch name or full lowercase Git SHA. Use the returned SHA for subsequent pagination.}
    get:
      operationId: resolveSourceRevision
      tags: [Catalog]
      summary: Resolve a revision and list published builds without starting CI
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionResolution'
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{project}/repositories/{repository}/builds:
    parameters:
      - $ref: '#/components/parameters/Project'
      - {name: repository, in: path, required: true, schema: {type: string}}
    post:
      operationId: reportBuild
      tags: [Catalog]
      summary: Report an immutable build using a scoped CI bearer credential (admin credentials are rejected)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedBuild'
        default: {$ref: '#/components/responses/Error'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildReport'
  /v1/projects/{project}/frontend-bindings/{frontend}/{revision}:
    parameters: &id001
    - $ref: '#/components/parameters/Project'
    - name: frontend
      in: path
      required: true
      schema:
        type: string
    - name: revision
      in: path
      required: true
