      - Frontend bindings
      summary: List a composition’s exact frontend revisions
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingsPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/catalog/validate:
    post:
      operationId: validateCatalogConfiguration
      tags: [Catalog]
      summary: Validate existing application infrastructure without writes
      description: A versioned JSON bundle; identical existing registrations are retained and differing immutable entries return 409. No workloads are created or adopted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogManifest'
      responses:
        '200':
          description: Normalized configuration, connectivity checks and verification limitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReport'
        default:
          $ref: '#/components/responses/Error'
  /v1/catalog/apply:
    post:
      operationId: applyCatalogConfiguration
      tags: [Catalog]
      summary: Validate and atomically register an application configuration
      description: A versioned JSON bundle; identical existing registrations are retained and differing immutable entries return 409. No workloads are created or adopted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogManifest'
      responses:
        '200':
          description: Normalized configuration, connectivity checks and verification limitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReport'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects:
    post:
      operationId: registerProject
      tags: [Catalog]
      summary: Register an immutable project
      description: Duplicate IDs or routing host claims return 409. Baseline registration validates existing sidecar workloads, ingress normalization and routing ownership before persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listProjects
      tags: [Catalog]
      summary: List registered projects
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Bounded project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/components:
    post:
      operationId: registerComponent
      tags: [Catalog]
      summary: Register an immutable component
      description: Duplicate IDs or routing host claims return 409. Baseline registration validates existing sidecar workloads, ingress normalization and routing ownership before persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentRegistration'
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - $ref: '#/components/parameters/Project'
    get:
      operationId: listComponents
      tags: [Catalog]
      summary: List a project's component profiles
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Bounded component list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Component'
        default:
          $ref: '#/components/responses/Error'
  /v1/projects/{project}/components/{component}:
    parameters:
      - $ref: '#/components/parameters/Project'
      - name: component
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getComponent
      tags: [Catalog]
      summary: Get an approved component profile
      responses:
        '200':
          description: Component profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
