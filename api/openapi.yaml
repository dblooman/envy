    put:
      operationId: bindFrontend
      tags:
      - Frontend bindings
      summary: Bind an exact frontend commit immutably to a composition
      responses:
        '200':
          description: Current binding observation; repeated identical writes are successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontendBindingView'
