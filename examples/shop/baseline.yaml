---
{
  "apiVersion": "networking.istio.io/v1",
  "kind": "Gateway",
  "metadata": {
    "name": "envy-preview",
    "namespace": "envy-shop",
    "labels": {
      "envy.dev/installation": "envy-local"
    }
  },
  "spec": {
    "selector": {
      "istio": "ingressgateway"
    },
    "servers": [
      {
        "port": {
          "number": 80,
          "name": "http",
          "protocol": "HTTP"
        },
        "hosts": [
          "*.envy.localhost"
        ]
      }
    ]
  }
}
---
{
  "apiVersion": "networking.istio.io/v1",
  "kind": "VirtualService",
  "metadata": {
    "name": "envy-shop",
    "namespace": "envy-shop",
    "labels": {
      "envy.dev/installation": "envy-local"
    }
  },
  "spec": {
    "hosts": [
      "shop.envy.localhost"
    ],
    "gateways": [
      "envy-preview"
    ],
    "http": [
      {
        "headers": {
          "request": {
            "remove": [
              "baggage"
            ]
          }
        },
        "route": [
          {
            "destination": {
              "host": "storefront.envy-shop.svc.cluster.local",
              "port": {
                "number": 8080
              }
            }
          }
        ],
        "timeout": "7s"
      }
    ]
  }
}
