apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: default
  hub: docker.io/istio
  tag: 1.31.0
  meshConfig:
    defaultConfig:
      holdApplicationUntilProxyStarts: true
  values:
    pilot:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    global:
      proxy:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
