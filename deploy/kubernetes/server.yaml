apiVersion: v1
kind: ServiceAccount
metadata:
  name: envy-server
  namespace: envy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envy-local-controller
rules:
  - apiGroups: [""]
    resources: [namespaces, services, serviceaccounts, resourcequotas]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: envy-local-controller
subjects:
  - kind: ServiceAccount
    name: envy-server
    namespace: envy-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: envy-local-controller
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: envy-postgres
  namespace: envy-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envy-postgres
  namespace: envy-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: envy-postgres
  template:
    metadata:
      labels:
        app: envy-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: envy
            - name: POSTGRES_USER
              value: envy
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: envy-credentials
                  key: postgres-password
          readinessProbe:
            exec:
              command: [pg_isready, -U, envy, -d, envy]
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: envy-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: envy-postgres
  namespace: envy-system
spec:
  selector:
    app: envy-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envy-server
  namespace: envy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envy-server
  template:
    metadata:
      labels:
        app: envy-server
    spec:
      serviceAccountName: envy-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: envy/server:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: envy-credentials
                  key: database-url
            - name: ENVY_API_TOKEN_FILE
              value: /secrets/api-token
            - name: ENVY_INSTALLATION_ID
              value: envy-local
            - name: ENVY_PREVIEW_BASE_URL
              value: http://envy.localhost:8080
            - name: ENVY_INGRESS_URL
              value: http://istio-ingressgateway.istio-system.svc.cluster.local
            - name: ENVY_BASELINE_HOST
              value: baseline.envy.localhost
            - name: ENVY_LISTEN_ADDR
              value: :8081
            - name: ENVY_SEED_DEMO
              value: "true"
            - name: ENVY_RECONCILE_INTERVAL
              value: 1s
            - name: ENVY_PROVISION_TIMEOUT
              value: 60s
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: credentials
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: credentials
          secret:
            secretName: envy-credentials
            defaultMode: 0440
            items:
              - key: api-token
                path: api-token
---
apiVersion: v1
kind: Service
metadata:
  name: envy-server
  namespace: envy-system
spec:
  type: NodePort
  selector:
    app: envy-server
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30081
