installationID: envy-lan
# The chart's versioned defaults select the matching published control-plane
# image. Baseline workload images remain separately pinned in builds.json.
externalDatabase:
  secretName: envy-database
auth:
  mode: token
  proxySecret: { name: "" }
  machineCredentialsSecret: { name: envy-machines }
service:
  type: NodePort
  nodePort: 30081
approvedWorkloadImagePullSecrets: [envy-ghcr]
runtime:
  previewBaseURL: http://envy.test:30080
  ingressURL: http://istio-ingressgateway.istio-system.svc.cluster.local:80
  baselineHost: baseline.envy.test
istio:
  injectionLabels: { istio.io/rev: null, istio-injection: enabled }
preflight:
  enabled: false
  path: /products
  expectedStatus: 200
