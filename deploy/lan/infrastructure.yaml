apiVersion: v1
kind: Namespace
metadata: {name: envy-system}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: envy-postgres, namespace: envy-system}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: envy-postgres, namespace: envy-system}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: envy-postgres}}
  template:
    metadata: {labels: {app: envy-postgres}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          env:
            - {name: POSTGRES_USER, value: envy}
            - {name: POSTGRES_DB, value: envy}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: envy-database, key: password}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe: {exec: {command: [pg_isready, -U, envy, -d, envy]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: envy-postgres}}]
---
apiVersion: v1
kind: Service
metadata: {name: envy-postgres, namespace: envy-system}
spec:
  selector: {app: envy-postgres}
  ports: [{port: 5432, targetPort: 5432}]
