# Installed independently of Envy. Only Kyverno reads or writes Secrets.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envy-lan-secret-validation
  labels: {rbac.kyverno.io/aggregate-to-admission-controller: 'true'}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: envy-lan-secret-generation
  labels: {rbac.kyverno.io/aggregate-to-background-controller: 'true'}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: envy-lan-registry}
spec:
  background: true
  rules:
    - name: distribute-approved-ghcr
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels: {envy.dev/installation: envy-lan}
          - resources:
              kinds: [Namespace]
              names: [envy-lan-baseline]
      generate:
        apiVersion: v1
        kind: Secret
        name: envy-ghcr
        namespace: '{{request.object.metadata.name}}'
        synchronize: true
        generateExisting: true
        clone: {namespace: envy-system, name: envy-ghcr}
