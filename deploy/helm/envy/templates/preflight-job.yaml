{{- if .Values.preflight.enabled }}
{{- $public := urlParse .Values.runtime.previewBaseURL }}
{{- $ingress := urlParse .Values.runtime.ingressURL }}
{{- if or (not (has $public.scheme (list "http" "https"))) (ne $public.scheme $ingress.scheme) }}
{{- fail "preflight requires matching http or https preview and ingress schemes" }}
{{- end }}
{{- $defaultPort := ternary "443" "80" (eq $public.scheme "https") }}
{{- $publicPort := trimPrefix ":" (regexFind ":[0-9]+$" $public.host) | default $defaultPort }}
{{- $ingressPort := trimPrefix ":" (regexFind ":[0-9]+$" $ingress.host) | default $defaultPort }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "envy.fullname" . }}-preflight
  labels: {{- include "envy.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "envy.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: postgres
          image: {{ .Values.preflight.databaseImage }}
          command: [sh, -ec]
          args:
            - 'PGCONNECT_TIMEOUT=10 PGOPTIONS="-c statement_timeout=10000" psql "$DATABASE_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --command="SELECT 1" >/dev/null'
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.externalDatabase.secretName }}, key: {{ .Values.externalDatabase.secretKey }} } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      containers:
        - name: ingress
          image: {{ .Values.preflight.curlImage }}
          command: [sh, -ec]
          args:
            - |
              status=$(curl --silent --show-error --noproxy '*' --output /dev/null --write-out '%{http_code}' --max-time 15 \
                --connect-to "${PUBLIC_HOST}:${PUBLIC_PORT}:${INGRESS_HOST}:${INGRESS_PORT}" \
                "${SCHEME}://${PUBLIC_HOST}:${PUBLIC_PORT}${PROBE_PATH}") || { echo 'Ingress connection or TLS verification failed' >&2; exit 1; }
              test "$status" = "$EXPECTED_STATUS" || { echo "Ingress returned HTTP $status; expected $EXPECTED_STATUS" >&2; exit 1; }
          env:
            - { name: SCHEME, value: {{ $public.scheme | quote }} }
            - { name: PUBLIC_HOST, value: {{ .Values.runtime.baselineHost | quote }} }
            - { name: PUBLIC_PORT, value: {{ $publicPort | quote }} }
            - { name: INGRESS_HOST, value: {{ regexReplaceAll ":[0-9]+$" $ingress.host "" | quote }} }
            - { name: INGRESS_PORT, value: {{ $ingressPort | quote }} }
            - { name: PROBE_PATH, value: {{ .Values.preflight.path | default "/" | quote }} }
            - { name: EXPECTED_STATUS, value: {{ .Values.preflight.expectedStatus | default 200 | toString | quote }} }
            {{- if .Values.runtime.caConfigMap.name }}
            - { name: CURL_CA_BUNDLE, value: /etc/envy-ca/ca.crt }
          volumeMounts:
            - { name: ingress-ca, mountPath: /etc/envy-ca, readOnly: true }
            {{- end }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      {{- if .Values.runtime.caConfigMap.name }}
      volumes:
        - name: ingress-ca
          configMap:
            name: {{ .Values.runtime.caConfigMap.name }}
            items: [{ key: {{ .Values.runtime.caConfigMap.key }}, path: ca.crt }]
      {{- end }}
{{- end }}
