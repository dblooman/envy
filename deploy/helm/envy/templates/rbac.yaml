apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "envy.fullname" . }}
  labels: {{- include "envy.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: {{ include "envy.fullname" . }} }
rules:
  - apiGroups: [""]
    resources: [namespaces, services, serviceaccounts, resourcequotas, pods, pods/log]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
{{- $mesh := default dict .Values.mesh -}}
{{- $meshProvider := default "istio" $mesh.provider -}}
{{- if eq $meshProvider "istio" }}
  - apiGroups: [networking.istio.io]
    resources: [virtualservices]
    verbs: [get, list, create, update, delete]
  - apiGroups: [networking.istio.io]
    resources: [gateways]
    verbs: [get, list]
{{- end }}
{{- if or (eq $meshProvider "gateway-api") (eq $meshProvider "cilium") }}
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [httproutes, referencegrants]
    verbs: [get, list, create, update, delete]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [gateways, gatewayclasses]
    verbs: [get, list]
{{- end }}
{{- if eq $meshProvider "cilium" }}
  - apiGroups: ["cilium.io"]
    resources: [ciliumenvoyconfigs]
    verbs: [get, list, create, update, delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: {{ include "envy.fullname" . }} }
subjects: [{ kind: ServiceAccount, name: {{ include "envy.fullname" . }}, namespace: {{ .Release.Namespace }} }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "envy.fullname" . }} }
