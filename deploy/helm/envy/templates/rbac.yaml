apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "envy.fullname" . }}
  labels: {{- include "envy.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: {{ include "envy.fullname" . }} }
rules:
  - apiGroups: [""]
    resources: [namespaces, services, serviceaccounts, resourcequotas, pods, pods/log]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices]
    verbs: [get, list, create, update, delete]
  - apiGroups: [networking.istio.io]
    resources: [gateways]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: {{ include "envy.fullname" . }} }
subjects: [{ kind: ServiceAccount, name: {{ include "envy.fullname" . }}, namespace: {{ .Release.Namespace }} }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "envy.fullname" . }} }
