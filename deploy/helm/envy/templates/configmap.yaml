apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "envy.fullname" . }}-config
  labels: {{- include "envy.labels" . | nindent 4 }}
data:
  config.json: |-
{{- $mesh := default dict .Values.mesh -}}
{{- $gw := default dict .Values.gatewayAPI -}}
{{- $cilium := default dict .Values.cilium -}}
{{- $linkerd := default dict .Values.linkerd -}}
{{ dict "installation_id" (required "installationID is required" .Values.installationID) "web_dir" "/web" "approved_image_pull_secrets" .Values.approvedWorkloadImagePullSecrets "mesh" (dict "provider" (default "istio" $mesh.provider)) "gateway_api" (dict "gateway_class" (default "" $gw.gatewayClass)) "cilium" (dict "native_cec" (default false $cilium.nativeCEC)) "linkerd" (dict "inject_annotation" (default false $linkerd.injectAnnotation)) "auth" (dict "mode" .Values.auth.mode "identity_header" .Values.auth.identityHeader "email_header" .Values.auth.emailHeader "external_origin" .Values.auth.externalOrigin "trusted_proxy_cidrs" .Values.auth.trustedProxyCIDRs) "limits" (dict "default_ttl" .Values.limits.defaultTTL "max_ttl" .Values.limits.maxTTL "max_compositions" (.Values.limits.maxCompositions | toString) "audit_retention" .Values.limits.auditRetention) "runtime" (dict "preview_base_url" .Values.runtime.previewBaseURL "ingress_url" .Values.runtime.ingressURL "baseline_host" .Values.runtime.baselineHost) "istio" (dict "injection_labels" .Values.istio.injectionLabels "ingress_selector" .Values.istio.ingressSelector) | toPrettyJson | nindent 4 }}
