apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "envy.fullname" . }}-config
  labels: {{- include "envy.labels" . | nindent 4 }}
data:
  config.json: |-
{{- $mesh := default dict .Values.mesh -}}
{{- $gw := default dict .Values.gatewayAPI -}}
{{- $provider := default "istio" $mesh.provider -}}
{{- $ingress := .Values.runtime.ingressURL -}}
{{- if and (eq $provider "istio") (not $ingress) -}}
{{- $ingress = "https://istio-ingressgateway.istio-system.svc.cluster.local" -}}
{{- end -}}
{{- if not $ingress -}}{{ fail "runtime.ingressURL is required for Cilium and Linkerd" }}{{- end -}}
{{- $config := dict "installation_id" (required "installationID is required" .Values.installationID) "web_dir" "/web" "approved_image_pull_secrets" .Values.approvedWorkloadImagePullSecrets "mesh" (dict "provider" (default "istio" $mesh.provider)) "gateway_api" (dict "gateway_class" (default "" $gw.gatewayClass)) "auth" (dict "mode" .Values.auth.mode "google_client_id" .Values.auth.googleClientID "google_allowed_domains" .Values.auth.googleAllowedDomains "google_allowed_emails" .Values.auth.googleAllowedEmails "oauth_clients" .Values.auth.oauthClients "identity_header" .Values.auth.identityHeader "email_header" .Values.auth.emailHeader "external_origin" .Values.auth.externalOrigin "trusted_proxy_cidrs" .Values.auth.trustedProxyCIDRs) "limits" (dict "default_ttl" .Values.limits.defaultTTL "max_ttl" .Values.limits.maxTTL "max_compositions" (.Values.limits.maxCompositions | toString) "audit_retention" .Values.limits.auditRetention) "runtime" (dict "preview_base_url" .Values.runtime.previewBaseURL "ingress_url" $ingress "baseline_host" .Values.runtime.baselineHost) -}}
{{- if eq $provider "istio" -}}
{{- $_ := set $config "istio" (dict "injection_labels" .Values.istio.injectionLabels "ingress_selector" .Values.istio.ingressSelector) -}}
{{- end -}}
{{- $_ := set $config "preview" (dict "composite" (default dict .Values.preview.composite) "max_cpu" .Values.preview.maxCPU "max_memory" .Values.preview.maxMemory "mesh_request_cpu" .Values.preview.meshRequestCPU "mesh_request_memory" .Values.preview.meshRequestMemory "mesh_limit_cpu" .Values.preview.meshLimitCPU "mesh_limit_memory" .Values.preview.meshLimitMemory "controller_namespace" (ternary .Release.Namespace "" .Values.preview.enabled) "controller_service_account" (ternary (include "envy.fullname" .) "" .Values.preview.enabled) "dependency_cluster_role" (ternary (printf "%s-dependencies" (include "envy.fullname" .)) "" .Values.preview.enabled)) -}}
{{- $_ := set $config "namespace_policy" .Values.namespacePolicy -}}
{{- $_ := set $config "pubsub_enabled" .Values.pubsub.enabled -}}
{{- $_ := set $config "observability" .Values.observability -}}
{{ $config | toPrettyJson | nindent 4 }}
