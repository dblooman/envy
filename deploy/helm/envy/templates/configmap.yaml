apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "envy.fullname" . }}-config
  labels: {{- include "envy.labels" . | nindent 4 }}
data:
  config.json: |-
{{ dict "installation_id" (required "installationID is required" .Values.installationID) "preview" (dict "max_cpu" .Values.preview.maxCPU "max_memory" .Values.preview.maxMemory "mesh_request_cpu" .Values.preview.meshRequestCPU "mesh_request_memory" .Values.preview.meshRequestMemory "mesh_limit_cpu" .Values.preview.meshLimitCPU "mesh_limit_memory" .Values.preview.meshLimitMemory "controller_namespace" (ternary .Release.Namespace "" .Values.preview.enabled) "controller_service_account" (ternary (include "envy.fullname" .) "" .Values.preview.enabled) "dependency_cluster_role" (ternary (printf "%s-dependencies" (include "envy.fullname" .)) "" .Values.preview.enabled)) "web_dir" "/web" "approved_image_pull_secrets" .Values.approvedWorkloadImagePullSecrets "auth" (dict "mode" .Values.auth.mode "identity_header" .Values.auth.identityHeader "email_header" .Values.auth.emailHeader "external_origin" .Values.auth.externalOrigin "trusted_proxy_cidrs" .Values.auth.trustedProxyCIDRs) "limits" (dict "default_ttl" .Values.limits.defaultTTL "max_ttl" .Values.limits.maxTTL "max_compositions" (.Values.limits.maxCompositions | toString) "audit_retention" .Values.limits.auditRetention) "runtime" (dict "preview_base_url" .Values.runtime.previewBaseURL "ingress_url" .Values.runtime.ingressURL "baseline_host" .Values.runtime.baselineHost) "istio" (dict "injection_labels" .Values.istio.injectionLabels "ingress_selector" .Values.istio.ingressSelector) | toPrettyJson | nindent 4 }}
