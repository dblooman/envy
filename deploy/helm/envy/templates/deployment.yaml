apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envy.fullname" . }}
  labels: {{- include "envy.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: envy, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: envy
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ include "envy.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      {{- if eq .Values.migrations.mode "init" }}
      initContainers:
        - name: migrate
          image: {{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.externalDatabase.secretName }}, key: {{ .Values.externalDatabase.secretKey }} } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      {{- end }}
      containers:
        - name: server
          image: {{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8081 }]
          env:
            {{- if .Values.github.appID }}
            - name: ENVY_GITHUB_APP_ID
              value: {{ .Values.github.appID | quote }}
            {{- end }}
            {{- if .Values.github.privateKeySecret.name }}
            - { name: ENVY_GITHUB_APP_PRIVATE_KEY_FILE, value: /github/private-key.pem }
            {{- end }}
            {{- if .Values.github.webhookSecret.name }}
            - { name: ENVY_GITHUB_WEBHOOK_SECRET_FILE, value: /github/webhook-secret }
            {{- end }}
            {{- if .Values.github.buildCredentialsSecret.name }}
            - { name: ENVY_BUILD_CREDENTIALS_FILE, value: /github/build-credentials.json }
            {{- end }}
            {{- if .Values.runtime.caConfigMap.name }}
            - name: ENVY_INGRESS_CA_FILE
              value: /etc/envy-ca/ca.crt
            {{- end }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ required "externalDatabase.secretName is required" .Values.externalDatabase.secretName }}, key: {{ .Values.externalDatabase.secretKey }} } }
            - name: ENVY_CONFIG_FILE
              value: /etc/envy/config.json
            - name: ENVY_MIGRATE_ON_START
              value: "false"
            {{- if .Values.auth.adminPasswordSecret.name }}
            - name: ENVY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.auth.adminPasswordSecret.name }}, key: {{ .Values.auth.adminPasswordSecret.key }} } }
            {{- end }}
            {{- if .Values.auth.googleClientSecret.name }}
            - name: ENVY_GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.auth.googleClientSecret.name }}, key: {{ .Values.auth.googleClientSecret.key }} } }
            {{- end }}
            {{- if .Values.auth.sharedTokenSecret.name }}
            - name: ENVY_API_TOKEN_FILE
              value: /secrets/shared-token
            {{- end }}
            {{- if .Values.auth.proxySecret.name }}
            - name: ENVY_PROXY_SECRET_FILE
              value: /secrets/proxy-secret
            {{- end }}
            {{- if .Values.auth.machineCredentialsSecret.name }}
            - name: ENVY_MACHINE_CREDENTIALS_FILE
              value: /secrets/machine-credentials.json
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /readyz, port: http } }
          livenessProbe: { httpGet: { path: /healthz, port: http } }
          volumeMounts:
            {{- if .Values.github.privateKeySecret.name }}
            - { name: github-key, mountPath: /github/private-key.pem, subPath: private-key.pem, readOnly: true }
            {{- end }}
            {{- if .Values.github.webhookSecret.name }}
            - { name: github-webhook, mountPath: /github/webhook-secret, subPath: webhook-secret, readOnly: true }
            {{- end }}
            {{- if .Values.github.buildCredentialsSecret.name }}
            - { name: github-builds, mountPath: /github/build-credentials.json, subPath: build-credentials.json, readOnly: true }
            {{- end }}
            {{- if .Values.runtime.caConfigMap.name }}
            - { name: ingress-ca, mountPath: /etc/envy-ca, readOnly: true }
            {{- end }}
            - { name: config, mountPath: /etc/envy, readOnly: true }
            {{- if .Values.auth.sharedTokenSecret.name }}
            - { name: shared-token, mountPath: /secrets/shared-token, subPath: shared-token, readOnly: true }
            {{- end }}
            {{- if .Values.auth.proxySecret.name }}
            - { name: proxy-secret, mountPath: /secrets/proxy-secret, subPath: proxy-secret, readOnly: true }
            {{- end }}
            {{- if .Values.auth.machineCredentialsSecret.name }}
            - { name: machine-credentials, mountPath: /secrets/machine-credentials.json, subPath: machine-credentials.json, readOnly: true }
            {{- end }}
      volumes:
        {{- if .Values.github.privateKeySecret.name }}
        - { name: github-key, secret: { secretName: {{ .Values.github.privateKeySecret.name }}, defaultMode: 0440, items: [{ key: {{ .Values.github.privateKeySecret.key }}, path: private-key.pem }] } }
        {{- end }}
        {{- if .Values.github.webhookSecret.name }}
        - { name: github-webhook, secret: { secretName: {{ .Values.github.webhookSecret.name }}, defaultMode: 0440, items: [{ key: {{ .Values.github.webhookSecret.key }}, path: webhook-secret }] } }
        {{- end }}
        {{- if .Values.github.buildCredentialsSecret.name }}
        - { name: github-builds, secret: { secretName: {{ .Values.github.buildCredentialsSecret.name }}, defaultMode: 0440, items: [{ key: {{ .Values.github.buildCredentialsSecret.key }}, path: build-credentials.json }] } }
        {{- end }}
        {{- if .Values.runtime.caConfigMap.name }}
        - name: ingress-ca
          configMap:
            name: {{ .Values.runtime.caConfigMap.name }}
            items: [{ key: {{ .Values.runtime.caConfigMap.key }}, path: ca.crt }]
        {{- end }}
        - { name: config, configMap: { name: {{ include "envy.fullname" . }}-config } }
        {{- if .Values.auth.sharedTokenSecret.name }}
        - { name: shared-token, secret: { secretName: {{ .Values.auth.sharedTokenSecret.name }}, items: [{ key: {{ .Values.auth.sharedTokenSecret.key }}, path: shared-token }] } }
        {{- end }}
        {{- if .Values.auth.proxySecret.name }}
        - { name: proxy-secret, secret: { secretName: {{ .Values.auth.proxySecret.name }}, items: [{ key: {{ .Values.auth.proxySecret.key }}, path: proxy-secret }] } }
        {{- end }}
        {{- if .Values.auth.machineCredentialsSecret.name }}
        - { name: machine-credentials, secret: { secretName: {{ .Values.auth.machineCredentialsSecret.name }}, items: [{ key: {{ .Values.auth.machineCredentialsSecret.key }}, path: machine-credentials.json }] } }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "envy.fullname" . }}
  labels: {{- include "envy.labels" . | nindent 4 }}
spec:
  {{- $serviceType := .Values.service.type | default "ClusterIP" }}
  {{- if not (has $serviceType (list "ClusterIP" "NodePort" "LoadBalancer")) }}
  {{- fail "service.type must be ClusterIP, NodePort, or LoadBalancer" }}
  {{- end }}
  {{- if and .Values.service.nodePort (eq $serviceType "ClusterIP") }}
  {{- fail "service.nodePort requires NodePort or LoadBalancer" }}
  {{- end }}
  type: {{ $serviceType }}
  selector: { app.kubernetes.io/name: envy, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
