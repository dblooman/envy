image:
  repository: davey/envy
  tag: "0.3.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Names approved for composition workload profiles; distributed externally.
approvedWorkloadImagePullSecrets: []
installationID: ""
github:
  appID: ""
  privateKeySecret: { name: "", key: private-key.pem }
  webhookSecret: { name: "", key: webhook-secret }
  buildCredentialsSecret: { name: "", key: build-credentials.json }
externalDatabase:
  secretName: envy-database
  secretKey: url
auth:
  mode: token # dev, password, google, token, proxy, or none
  adminPasswordSecret: { name: "", key: password }
  googleClientID: ""
  googleClientSecret: { name: "", key: client-secret }
  googleAllowedDomains: "" # Comma-separated Workspace domains.
  googleAllowedEmails: "" # Comma-separated verified email addresses.
  oauthClients: [] # Optional preregistered public clients: id, name, redirect_uris.
  sharedTokenSecret: { name: "", key: token }
  proxySecret: { name: "", key: secret }
  machineCredentialsSecret: { name: "", key: credentials.json }
  identityHeader: X-Envy-User
  emailHeader: X-Envy-Email
  trustedProxyCIDRs: 10.0.0.0/8
  externalOrigin: https://envy.example.com
runtime:
  caConfigMap: { name: "", key: ca.crt }
  previewBaseURL: https://envy.example.com
  ingressURL: "" # Required for Cilium/Linkerd; Istio retains its legacy internal address.
  baselineHost: baseline.example.com
mesh:
  provider: istio # "istio", "cilium", or "linkerd"
gatewayAPI:
  gatewayClass: ""
istio:
  injectionLabels: { istio.io/rev: default }
  ingressSelector: { istio: ingressgateway }
limits:
  defaultTTL: 8h
  maxTTL: 24h
  maxCompositions: 20
  auditRetention: retained
service:
  type: ClusterIP
  nodePort: null
  port: 8081
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 500m, memory: 256Mi }
networkPolicy:
  enabled: true
  ingress: []
preflight:
  enabled: false
  path: /
  expectedStatus: 200
  databaseImage: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
  curlImage: curlimages/curl:8.14.1

# Opt-in dependency permissions for deployment-derived preview profiles.
preview:
  enabled: false
  maxCPU: "2"
  maxMemory: 2Gi
  meshRequestCPU: 100m
  meshRequestMemory: 128Mi
  meshLimitCPU: "2"
  meshLimitMemory: 1Gi

# Uses operator-provided Google Application Default Credentials. No IAM grants are created.
pubsub:
  enabled: false
