name: Mesh acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['internal/**', 'cmd/**', 'deploy/**', 'examples/**', 'scripts/**', 'tests/**', 'go.*', 'Dockerfile.*', '.dockerignore', 'Makefile', '.nvmrc', 'web/package.json', 'web/pnpm-lock.yaml', '.github/workflows/mesh-acceptance.yml']
permissions:
  contents: read
jobs:
  mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Re-enable Linkerd after its controller reports current-generation status.
    strategy:
      fail-fast: false
      matrix:
        provider: [istio, cilium]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Istio upgrade test builds the pinned previous revision.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.19.0
      - name: Install pinned kind
        run: go install "sigs.k8s.io/kind@v$(python3 -c 'import json; print(json.load(open("deploy/testing/versions.json"))["kind"])')"
      - name: Unit and chart checks
        run: |
          go test ./...
          python3 deploy/testing/check-charts.py
          python3 deploy/testing/render-versions.py --check
      - name: Controller and traffic acceptance
        env:
          ENVY_CLUSTER_NAME: envy-ci-${{ matrix.provider }}
        run: make test-mesh MESH=${{ matrix.provider }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mesh-${{ matrix.provider }}
          path: |
            .envy/envy-ci-${{ matrix.provider }}/acceptance.log
            .envy/envy-ci-${{ matrix.provider }}/pods.txt
            .envy/envy-ci-${{ matrix.provider }}/events.txt
            .envy/envy-ci-${{ matrix.provider }}/routes.yaml
            .envy/envy-ci-${{ matrix.provider }}/accepted-pods.json
            .envy/envy-ci-${{ matrix.provider }}/preflight.json
            .envy/envy-ci-${{ matrix.provider }}/upgrade-result.json
